[project]
name = "dca-backtest"
version = "0.1.0"
description = "定投组合回测与稳健性检验框架：起点敏感性、样本外、权重扰动、Bootstrap、蒙特卡洛"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["定投", "DCA", "backtest", "portfolio", "fund", "quant"]
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10",
  "pyarrow>=12.0", "PyYAML>=6.0", "requests>=2.28",
]

[project.optional-dependencies]
extra = ["akshare>=1.16"]

[project.scripts]
dca = "dca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dca", "dca.sources", "dca.analysis"]
