name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "archive/**", "**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # 刻意不安装 akshare：核心功能必须不依赖它
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
        # 测试全部离线：不发网络请求、不读缓存数据，因此 CI 稳定且无需 secrets

      - name: Smoke test CLI
        shell: bash
        env:
          # 仅作用于本步骤里那段内联脚本：Windows 控制台默认 cp1252。
          # CLI 自身的编码处理由 tests/test_engine.py::test_cli_survives_non_utf8_console
          # 显式以 cp1252 验证，不靠这里兜底。
          PYTHONIOENCODING: utf-8
        run: |
          python -m dca sources
          python -m dca --help
          for f in configs/*.yaml configs/examples/*.yaml; do
            python - "$f" <<'PY'
          import sys
          from dca import Portfolio
          p = Portfolio.from_yaml(sys.argv[1])
          assert abs(p.weights.sum() - 1) < 1e-9, f"{sys.argv[1]}: 权重和不为 1"
          print(f"  ok  {sys.argv[1]:44s} {p.name} / {len(p.assets)} assets")
          PY
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - name: Ruff check
        run: ruff check dca tests
      - name: Ruff format check
        run: ruff format --check --diff dca tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify all subpackages are shipped
        run: |
          python - <<'PY'
          import tarfile, glob, sys
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sdist).getnames()
          for pkg in ("dca", "dca/sources", "dca/analysis", "dca/report"):
              want = f"{pkg}/__init__.py"
              assert any(n.endswith(want) for n in names), f"缺少 {want}"
          print("所有子包均已打包")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
